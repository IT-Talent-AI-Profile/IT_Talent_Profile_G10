<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Tuyển Dụng AI 3D - IT Talent AI Profile</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    /* =====================================================================
       3D & CYBER SAAS EXPERIENCE - RECRUITER JOBS COMMAND CENTER
       ===================================================================== */
    
    :root {
      --hero-bg: radial-gradient(130% 120% at 50% 0%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      --glass-card: rgba(255, 255, 255, 0.9);
      --glass-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 15px rgba(99, 102, 241, 0.05);
    }

    body {
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 30%, rgba(168, 85, 247, 0.06) 0px, transparent 40%),
        radial-gradient(at 50% 100%, rgba(56, 189, 248, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      min-height: 100vh;
    }

    /* 1. 3D HERO COMMAND BANNER */
    .hero-3d-wrapper {
      perspective: 1200px;
      margin-top: 24px;
    }

    .hero-3d-card {
      background: var(--hero-bg);
      color: #fff;
      border-radius: var(--radius-xl);
      padding: 36px 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.45), 0 0 30px rgba(99, 102, 241, 0.2);
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
    }

    .hero-3d-card:hover {
      box-shadow: 0 30px 60px -12px rgba(15, 23, 42, 0.55), 0 0 45px rgba(99, 102, 241, 0.3);
    }

    /* Ambient animated lighting blobs */
    .hero-glow-blob {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(168, 85, 247, 0) 70%);
      filter: blur(45px);
      pointer-events: none;
      top: -100px;
      right: -50px;
      animation: floatGlow 8s ease-in-out infinite alternate;
    }

    .hero-glow-blob-2 {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(99, 102, 241, 0) 70%);
      filter: blur(40px);
      pointer-events: none;
      bottom: -80px;
      left: 5%;
      animation: floatGlow2 10s ease-in-out infinite alternate;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-30px, 40px) scale(1.15); }
    }

    @keyframes floatGlow2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.2); }
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
    }

    .hero-identity {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .avatar-3d-container {
      position: relative;
      width: 76px;
      height: 76px;
      flex-shrink: 0;
    }

    .avatar-3d-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #38bdf8, #818cf8, #a855f7, #38bdf8);
      animation: spinRing 6s linear infinite;
      filter: blur(2px);
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    .avatar-3d-face {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.3), 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .hero-meta h1 {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .hero-meta p {
      font-size: 14px;
      color: #94a3b8;
      margin: 0 0 10px;
    }

    /* 3D Stat Counters */
    .hero-stats-3d {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    .stat-card-3d {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-lg);
      padding: 12px 20px;
      text-align: right;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
      min-width: 130px;
    }

    .stat-card-3d:hover {
      transform: translateY(-4px) translateZ(10px);
      border-color: rgba(99, 102, 241, 0.6);
      background: rgba(255, 255, 255, 0.1);
    }

    .stat-label-3d {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .stat-value-3d {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    /* 2. FILTER & TOOLBAR */
    .toolbar-3d {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 28px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .toolbar-title {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      background: #ffffff;
      padding: 4px;
      border-radius: var(--radius-lg);
      border: 1px solid #e2e8f0;
      box-shadow: var(--shadow-xs);
    }

    .filter-btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      box-shadow: none;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      color: #4f46e5;
      background: #f8fafc;
      transform: none;
      box-shadow: none;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
    }

    /* 3. 3D INTERACTIVE JOB CARDS */
    .job-list-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .job-card-3d {
      background: #ffffff;
      border-radius: var(--radius-xl);
      border: 1px solid #e2e8f0;
      padding: 26px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .job-card-3d:hover {
      transform: translateY(-5px) scale(1.008);
      box-shadow: 0 25px 45px -12px rgba(15, 23, 42, 0.12), 0 0 25px rgba(99, 102, 241, 0.1);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .job-card-3d::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: linear-gradient(180deg, #6366f1, #38bdf8);
      opacity: 0.8;
      transition: width 0.3s ease;
    }

    .job-card-3d:hover::before {
      width: 8px;
    }

    .job-meta-3d {
      flex: 1;
    }

    .job-header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .job-title-3d {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin: 0;
      transition: color 0.2s ease;
    }

    .job-card-3d:hover .job-title-3d {
      color: #4f46e5;
    }

    .radar-pulse-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #16a34a;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .radar-pulse-dot::before {
      content: '';
      width: 7px;
      height: 7px;
      background: #16a34a;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7);
      animation: pulseRadar 2s infinite;
    }

    @keyframes pulseRadar {
      0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(22, 163, 74, 0); }
      100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
    }

    .job-desc-3d {
      color: #475569;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 16px;
      max-width: 740px;
    }

    .job-tags-3d {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .tag-required {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
      color: #4338ca;
      border: 1px solid #c7d2fe;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: var(--radius-md);
    }

    .tag-preferred {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f8fafc;
      color: #64748b;
      border: 1px solid #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: var(--radius-md);
    }

    .tag-exp {
      background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
      color: #7e22ce;
      border: 1px solid #e9d5ff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: var(--radius-md);
    }

    .btn-match-ai {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 50%, #4338ca 100%);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-match-ai:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.45);
    }

    /* 4. 3D AI MATCHING MODAL */
    .modal-backdrop-3d {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-3d-card {
      background: #ffffff;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.3), 0 0 30px rgba(99, 102, 241, 0.2);
      max-width: 680px;
      width: 100%;
      overflow: hidden;
      animation: modalSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalSlideUp {
      from { transform: translateY(30px) scale(0.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .modal-header-3d {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
      color: #ffffff;
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .modal-header-3d h3 {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      color: #ffffff !important;
      display: flex;
      align-items: center;
      gap: 12px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .modal-close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 18px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
      padding: 0;
    }

    .modal-close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: none;
      box-shadow: none;
    }

    .modal-body-3d {
      padding: 24px 28px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .candidate-match-card {
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      transition: all 0.2s ease;
      background: #fff;
    }

    .candidate-match-card:hover {
      border-color: #6366f1;
      background: #f8fafc;
      transform: translateX(4px);
    }

    .match-percent-badge {
      font-size: 18px;
      font-weight: 800;
      color: #16a34a;
      background: #f0fdf4;
      border: 1.5px solid #86efac;
      padding: 8px 14px;
      border-radius: var(--radius-lg);
      text-align: center;
      min-width: 80px;
    }

    @media (max-width: 860px) {
      .job-card-3d {
        flex-direction: column;
        align-items: flex-start;
      }
      .btn-match-ai {
        width: 100%;
        justify-content: center;
      }
      .hero-content {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 1180px; padding-bottom: 60px;">
    <div id="error" class="error"></div>
    <div id="success" class="success" style="display: none;"></div>
    <div class="hero-3d-wrapper">
      <div class="hero-3d-card" id="heroRecruiterCard">
        <div class="hero-glow-blob"></div>
        <div class="hero-glow-blob-2"></div>
        <div class="hero-content">
          <div class="hero-identity">
            <div class="avatar-3d-container">
              <div class="avatar-3d-ring"></div>
              <div class="avatar-3d-face">🏢</div>
            </div>
            <div class="hero-meta">
              <h1>Quản Lý Tin Tuyển Dụng</h1>
              <p>Đăng tin, gắn kỹ năng yêu cầu và đối sánh ứng viên IT phù hợp nhất cho từng vị trí</p>
            </div>
          </div>
          <div class="hero-stats-3d">
            <div class="stat-card-3d">
              <div class="stat-label-3d">Tin Đang Mở</div>
              <div class="stat-value-3d" id="statOpen">0</div>
            </div>
            <div class="stat-card-3d">
              <div class="stat-label-3d">Tổng Số Tin</div>
              <div class="stat-value-3d" id="statTotal">0</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="toolbar-3d">
      <h2 class="toolbar-title"><span>📋</span> Danh Sách Vị Trí Tuyển Dụng</h2>
      <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
        <div class="filter-pills">
          <button type="button" class="filter-btn active" id="fAll" onclick="setFilter('all', this)">Tất cả (0)</button>
          <button type="button" class="filter-btn" id="fOpen" onclick="setFilter('open', this)">Đang mở (0)</button>
          <button type="button" class="filter-btn" id="fClosed" onclick="setFilter('closed', this)">Đã đóng (0)</button>
        </div>
        <button type="button" class="btn" style="padding: 9px 18px; font-size: 13px;" onclick="openJobModal(null)"><span>➕</span> Đăng Tin Tuyển Dụng</button>
        <a href="candidates.html" class="btn secondary" style="padding: 9px 18px; font-size: 13px;"><span>🔍</span> Tìm Kiếm Ứng Viên</a>
      </div>
    </div>
    <div class="job-list-container" id="jobList"></div>
  </div>
  <div class="modal-backdrop-3d" id="jobModal">
    <div class="modal-3d-card" style="max-width: 640px;">
      <div class="modal-header-3d">
        <h3><span id="jobModalTitle">Đăng Tin Tuyển Dụng Mới</span></h3>
        <button type="button" class="modal-close-btn" onclick="closeJobModal()">✕</button>
      </div>
      <div class="modal-body-3d">
        <form id="jobForm" onsubmit="saveJob(event)">
          <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">Tiêu đề vị trí tuyển dụng (*)</label>
            <input type="text" id="jobTitle" maxlength="150" placeholder="vd: Backend Junior" required>
          </div>
          <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">Mô tả công việc</label>
            <textarea id="jobDesc" rows="4" placeholder="Mô tả ngắn về trách nhiệm chính..."></textarea>
          </div>
          <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px;">Kinh nghiệm tối thiểu (năm)</label>
            <input type="number" id="jobYears" min="0" step="0.5" value="0" required>
          </div>
          <div style="display: flex; justify-content: flex-end; gap: 10px;">
            <button type="button" class="btn secondary" onclick="closeJobModal()">Hủy</button>
            <button type="submit" class="btn">Lưu tin</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    let jobs = [];
    let skills = [];
    let filter = "all";
    let editingId = null;

    function showSuccess(text) {
      const box = document.getElementById("success");
      box.textContent = text;
      box.style.display = "block";
      setTimeout(() => { box.style.display = "none"; }, 4000);
    }

    function skillOptionsHtml() {
      let html = '<option value="">-- Chọn kỹ năng --</option>';
      let group = null;
      skills.forEach(skill => {
        if (skill.group !== group) {
          if (group !== null) html += "</optgroup>";
          group = skill.group;
          html += '<optgroup label="' + esc(group) + '">';
        }
        html += '<option value="' + skill.id + '">' + esc(skill.name) + "</option>";
      });
      return group === null ? html : html + "</optgroup>";
    }

    function cardHtml(job, options) {
      const tags = job.skills.map(skill => {
        const label = skill.is_required ? "★ Bắt buộc: " : "⚡ Ưu tiên: ";
        const css = skill.is_required ? "tag-required" : "tag-preferred";
        return '<span class="' + css + '">' + label + esc(skill.name) + ' <span style="cursor: pointer;" title="Gỡ kỹ năng" onclick="removeSkill(' + job.id + ', ' + skill.skill_id + ')">✕</span></span>';
      }).join(" ");
      const status = job.is_open
        ? '<span class="radar-pulse-dot">Đang Mở Tuyển</span>'
        : '<span class="badge-3d" style="background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; font-size: 11px; padding: 3px 10px;">Đã Đóng</span>';
      return '<div class="job-card-3d"' + (job.is_open ? "" : ' style="opacity: 0.85;"') + '>'
        + '<div class="job-meta-3d">'
        + '<div class="job-header-row"><h3 class="job-title-3d">' + esc(job.title) + "</h3>" + status + "</div>"
        + '<p class="job-desc-3d">' + esc(job.description || "Chưa có mô tả") + "</p>"
        + '<div class="job-tags-3d">' + tags + '<span class="tag-exp">⏱️ Yêu cầu: ≥ ' + job.min_years + " năm kinh nghiệm</span></div>"
        + '<div style="display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap;">'
        + '<select id="skill-' + job.id + '" style="width: auto; min-width: 180px;">' + options + "</select>"
        + '<select id="required-' + job.id + '" style="width: auto;"><option value="true">Bắt buộc</option><option value="false">Ưu tiên</option></select>'
        + '<button type="button" class="btn secondary" style="font-size: 13px;" onclick="addSkill(' + job.id + ')">Gắn kỹ năng</button>'
        + "</div></div>"
        + '<div style="display: flex; flex-direction: column; gap: 8px;">'
        + '<a class="btn-match-ai" href="match.html?job_id=' + job.id + '"><span>⚡</span> Xem Đối Sánh</a>'
        + '<button type="button" class="btn secondary" style="font-size: 13px;" onclick="openJobModal(' + job.id + ')">✏️ Sửa</button>'
        + '<button type="button" class="btn secondary" style="font-size: 13px;" onclick="toggleStatus(' + job.id + ')">' + (job.is_open ? "🔒 Đóng tin" : "🔓 Mở lại tin") + "</button>"
        + '<button type="button" class="btn secondary" style="font-size: 13px;" onclick="removeJob(' + job.id + ')">🗑️ Xóa</button>'
        + "</div></div>";
    }

    function render() {
      const openCount = jobs.filter(job => job.is_open).length;
      document.getElementById("statOpen").textContent = openCount;
      document.getElementById("statTotal").textContent = jobs.length;
      document.getElementById("fAll").textContent = "Tất cả (" + jobs.length + ")";
      document.getElementById("fOpen").textContent = "Đang mở (" + openCount + ")";
      document.getElementById("fClosed").textContent = "Đã đóng (" + (jobs.length - openCount) + ")";
      const shown = jobs.filter(job => filter === "all" || (filter === "open") === job.is_open);
      const options = skillOptionsHtml();
      document.getElementById("jobList").innerHTML = shown.length
        ? shown.map(job => cardHtml(job, options)).join("")
        : '<p class="job-desc-3d">Chưa có tin tuyển dụng nào.</p>';
    }

    async function loadJobs() {
      const data = await api("/jobs");
      if (data === null) return;
      jobs = data;
      render();
    }

    function setFilter(status, button) {
      document.querySelectorAll(".filter-btn").forEach(item => item.classList.remove("active"));
      button.classList.add("active");
      filter = status;
      render();
    }

    function openJobModal(id) {
      editingId = id;
      const job = jobs.find(item => item.id === id);
      document.getElementById("jobModalTitle").textContent = job ? "Sửa Tin Tuyển Dụng" : "Đăng Tin Tuyển Dụng Mới";
      document.getElementById("jobTitle").value = job ? job.title : "";
      document.getElementById("jobDesc").value = job ? job.description || "" : "";
      document.getElementById("jobYears").value = job ? job.min_years : 0;
      document.getElementById("jobModal").style.display = "flex";
    }

    function closeJobModal() {
      document.getElementById("jobModal").style.display = "none";
      editingId = null;
    }

    async function saveJob(e) {
      e.preventDefault();
      const body = {
        title: document.getElementById("jobTitle").value.trim(),
        description: document.getElementById("jobDesc").value.trim(),
        min_years: parseFloat(document.getElementById("jobYears").value) || 0
      };
      const creating = editingId === null;
      const data = creating ? await api("/jobs", "POST", body) : await api("/jobs/" + editingId, "PUT", body);
      if (data === null) return;
      closeJobModal();
      showSuccess(creating ? "Đã đăng tin tuyển dụng" : "Đã cập nhật tin tuyển dụng");
      await loadJobs();
    }

    async function removeJob(id) {
      const job = jobs.find(item => item.id === id);
      if (!confirm('Bạn có chắc muốn xóa tin "' + job.title + '"? Thao tác này không thể hoàn tác.')) return;
      const data = await api("/jobs/" + id, "DELETE");
      if (data === null) return;
      showSuccess("Đã xóa tin tuyển dụng");
      await loadJobs();
    }

    async function toggleStatus(id) {
      const job = jobs.find(item => item.id === id);
      const data = await api("/jobs/" + id + "/status", "PATCH", { is_open: !job.is_open });
      if (data === null) return;
      showSuccess(job.is_open ? "Đã đóng tin tuyển dụng" : "Đã mở lại tin tuyển dụng");
      await loadJobs();
    }

    async function addSkill(id) {
      const skillId = document.getElementById("skill-" + id).value;
      if (skillId === "") {
        showError("Vui lòng chọn kỹ năng cần gắn");
        return;
      }
      const body = { skill_id: parseInt(skillId), is_required: document.getElementById("required-" + id).value === "true" };
      const data = await api("/jobs/" + id + "/skills", "POST", body);
      if (data === null) return;
      await loadJobs();
    }

    async function removeSkill(id, skillId) {
      const data = await api("/jobs/" + id + "/skills/" + skillId, "DELETE");
      if (data === null) return;
      await loadJobs();
    }

    async function init() {
      const list = await api("/skills");
      if (list !== null) skills = list;
      await loadJobs();
    }

    if (guard("recruiter")) init();
  </script>
</body>
</html>
