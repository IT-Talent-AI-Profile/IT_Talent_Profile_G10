<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IT Talent AI Profile — Final Demo</title>
<script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-dark:#0f172a;--bg-card:#1e293b;--accent:#3b82f6;--accent2:#8b5cf6;
  --success:#10b981;--warn:#f59e0b;--danger:#ef4444;--text:#e2e8f0;--text-muted:#94a3b8;
}
body{font-family:'Inter',sans-serif;background:var(--bg-dark);color:var(--text);overflow:hidden;height:100vh;width:100vw}
/* Title bar */
.title-bar{height:32px;background:#0a0f1e;display:flex;align-items:center;padding:0 12px;gap:8px;border-bottom:1px solid #1e293b;user-select:none}
.title-bar .dot{width:12px;height:12px;border-radius:50%}
.title-bar .dot.r{background:#ef4444}.title-bar .dot.y{background:#f59e0b}.title-bar .dot.g{background:#22c55e}
.title-bar .file-name{flex:1;text-align:center;font-size:12px;color:#94a3b8;font-family:'JetBrains Mono',monospace}
/* Player container */
.player-wrap{position:relative;width:100%;height:calc(100vh - 32px);display:flex;flex-direction:column;background:#0f172a}
.viewport{flex:1;position:relative;overflow:hidden;background:linear-gradient(135deg,#0f172a 0%,#1a1033 50%,#0f172a 100%)}
/* Watermark */
.watermark{position:absolute;top:16px;right:20px;font-size:11px;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,.08);z-index:5;pointer-events:none;text-transform:uppercase}
/* Badge */
.demo-badge{position:absolute;top:16px;left:20px;z-index:10;display:flex;gap:8px;align-items:center}
.demo-badge .chip{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.5px}
/* Subtitle bar */
.subtitle-bar{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);width:80%;max-width:900px;z-index:20;text-align:center;pointer-events:none}
.subtitle-text{display:inline-block;background:rgba(0,0,0,.85);color:#fff;padding:10px 24px;border-radius:8px;font-size:15px;line-height:1.6;font-weight:400;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);max-width:100%;transition:opacity .3s}
.subtitle-text code{font-family:'JetBrains Mono',monospace;background:rgba(59,130,246,.25);color:#93c5fd;padding:1px 6px;border-radius:4px;font-size:13px}
/* Controls */
.controls{height:64px;background:rgba(15,23,42,.95);border-top:1px solid #1e293b;display:flex;align-items:center;padding:0 20px;gap:16px;z-index:30;backdrop-filter:blur(12px)}
.progress-wrap{flex:1;height:6px;background:#334155;border-radius:3px;cursor:pointer;position:relative;overflow:visible}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:3px;transition:width .15s linear;position:relative}
.progress-fill::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(59,130,246,.5);opacity:0;transition:opacity .2s}
.progress-wrap:hover .progress-fill::after{opacity:1}
.ctrl-btn{background:none;border:none;color:#e2e8f0;cursor:pointer;font-size:18px;padding:6px;border-radius:6px;transition:all .15s}
.ctrl-btn:hover{background:#334155;color:#fff}
.ctrl-btn.play-btn{font-size:24px}
.time-display{font-family:'JetBrains Mono',monospace;font-size:12px;color:#94a3b8;min-width:100px;text-align:center}
.speed-btn{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:4px 8px;border-radius:4px;background:#334155;border:1px solid #475569;color:#e2e8f0;cursor:pointer}
.speed-btn:hover{border-color:#3b82f6}
/* Scene chips */
.scene-chips{height:48px;background:#0a0f1e;border-top:1px solid #1e293b;display:flex;align-items:center;gap:6px;padding:0 16px;overflow-x:auto;z-index:30}
.scene-chips::-webkit-scrollbar{height:0}
.scene-chip{flex-shrink:0;padding:4px 14px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid #334155;color:#94a3b8;background:#1e293b;transition:all .2s;white-space:nowrap}
.scene-chip:hover{border-color:#3b82f6;color:#e2e8f0}
.scene-chip.active{background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-color:transparent;color:#fff}
.scene-chip.part-label{background:transparent;border:none;color:#64748b;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:default;font-size:10px}
/* Virtual cursor */
.vcursor{position:absolute;z-index:100;pointer-events:none;transition:left .6s cubic-bezier(.4,0,.2,1),top .6s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.vcursor svg{width:24px;height:24px}
.click-ripple{position:absolute;z-index:99;width:40px;height:40px;border-radius:50%;border:2px solid rgba(59,130,246,.6);animation:rippleOut .6s ease-out forwards;pointer-events:none}
@keyframes rippleOut{0%{transform:scale(.5);opacity:1}100%{transform:scale(2);opacity:0}}
/* Scene content shared styles */
.scene-container{width:100%;height:100%;position:absolute;top:0;left:0;display:flex;align-items:center;justify-content:center;padding:40px}
/* Login scene */
.login-card{width:420px;background:linear-gradient(145deg,#1e293b,#0f172a);border:1px solid #334155;border-radius:20px;padding:40px;box-shadow:0 25px 60px rgba(0,0,0,.5)}
.login-card h2{font-size:28px;font-weight:800;text-align:center;margin-bottom:8px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-card .subtitle{text-align:center;color:#64748b;font-size:13px;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px}
.form-input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:14px;outline:none;transition:border .2s}
.form-input:focus{border-color:#3b82f6}
.login-btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px;transition:all .2s}
.login-btn.primary{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}
.login-btn.primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(59,130,246,.3)}
.quick-login{display:flex;gap:8px;margin-top:16px}
.quick-login button{flex:1;padding:8px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s}
.quick-login button:hover{border-color:#3b82f6;color:#e2e8f0}
/* Profile 3D card */
.profile-3d{width:380px;border-radius:20px;padding:32px;background:linear-gradient(145deg,#1e293b,#162032);border:1px solid #334155;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:perspective(800px) rotateY(-5deg) rotateX(3deg);transition:transform .3s}
.profile-3d:hover{transform:perspective(800px) rotateY(0) rotateX(0)}
.avatar-led{width:100px;height:100px;border-radius:50%;margin:0 auto 16px;background:conic-gradient(#3b82f6,#8b5cf6,#ec4899,#f59e0b,#10b981,#3b82f6);padding:3px;animation:ledSpin 3s linear infinite}
.avatar-led img,.avatar-led .av-inner{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:#3b82f6}
@keyframes ledSpin{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
.career-bar{display:flex;align-items:center;gap:0;margin-top:20px;position:relative}
.career-step{flex:1;text-align:center;position:relative;z-index:1}
.career-step .dot{width:28px;height:28px;border-radius:50%;background:#334155;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #475569;transition:all .3s}
.career-step .dot.filled{background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-color:#3b82f6;color:#fff}
.career-step .dot.current{background:linear-gradient(135deg,#8b5cf6,#ec4899);border-color:#8b5cf6;box-shadow:0 0 16px rgba(139,92,246,.5);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 16px rgba(139,92,246,.3)}50%{box-shadow:0 0 24px rgba(139,92,246,.6)}}
.career-step span{font-size:10px;color:#64748b;font-weight:600}
.career-line{position:absolute;top:14px;left:12.5%;right:12.5%;height:2px;background:#334155;z-index:0}
.career-line-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);transition:width .5s}
/* Skills table */
.skills-panel{width:700px;max-height:420px;overflow-y:auto;background:#1e293b;border-radius:16px;border:1px solid #334155;padding:20px}
.skills-panel::-webkit-scrollbar{width:6px}.skills-panel::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
.skill-group-header{font-size:13px;font-weight:700;color:#8b5cf6;margin:12px 0 8px;display:flex;align-items:center;gap:8px}
.skill-group-header::before{content:'';width:4px;height:16px;background:#8b5cf6;border-radius:2px}
.skill-row{display:flex;align-items:center;padding:6px 12px;border-radius:8px;margin-bottom:4px;transition:background .2s}
.skill-row:hover{background:#334155}
.skill-name{flex:1;font-size:13px;font-weight:500}
.stars{display:flex;gap:2px;margin-right:12px}
.stars .star{font-size:14px}
.stars .star.on{color:#f59e0b}.stars .star.off{color:#334155}
.skill-bar{width:120px;height:6px;background:#334155;border-radius:3px;overflow:hidden;margin-right:12px}
.skill-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.skill-score{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;min-width:35px;text-align:right}
/* CV Upload */
.cv-upload-zone{width:500px;border:2px dashed #475569;border-radius:20px;padding:48px;text-align:center;background:#1e293b;transition:all .3s}
.cv-upload-zone.active{border-color:#3b82f6;background:rgba(59,130,246,.05)}
.cv-upload-zone .icon{font-size:48px;margin-bottom:16px}
/* Radar chart (CSS only) */
.radar-wrap{width:300px;height:300px;position:relative;margin:0 auto}
/* Eval panel */
.eval-panel{width:600px;background:#1e293b;border-radius:16px;border:1px solid #334155;padding:28px;overflow:hidden}
.eval-group{display:flex;align-items:center;margin-bottom:12px;gap:12px}
.eval-group .label{width:100px;font-size:12px;font-weight:600;color:#94a3b8;text-align:right}
.eval-group .bar{flex:1;height:20px;background:#0f172a;border-radius:10px;overflow:hidden;position:relative}
.eval-group .bar-fill{height:100%;border-radius:10px;transition:width 1s ease}
.eval-group .val{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;min-width:40px}
.level-badge{display:inline-flex;padding:8px 24px;border-radius:12px;font-size:18px;font-weight:800;letter-spacing:1px}
/* AI summary */
.ai-summary-card{width:560px;background:linear-gradient(145deg,#1e293b,#1a1030);border:1px solid #334155;border-radius:16px;padding:28px}
.ai-typing{border-left:3px solid #8b5cf6;padding-left:16px;font-size:14px;line-height:1.8;color:#cbd5e1}
.ai-typing .cursor-blink{display:inline-block;width:2px;height:16px;background:#8b5cf6;animation:blink 1s infinite;vertical-align:text-bottom;margin-left:2px}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
/* Job card */
.job-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;margin-bottom:12px;transition:all .2s}
.job-card:hover{border-color:#3b82f6;transform:translateX(4px)}
/* Match result */
.match-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:16px}
.match-pct{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;font-family:'JetBrains Mono',monospace}
/* Notification */
.notif-bell{position:relative;font-size:24px;cursor:pointer}
.notif-badge{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:#ef4444;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}
/* Danger zone */
.danger-zone{border:2px solid rgba(239,68,68,.3);border-radius:12px;padding:20px;background:rgba(239,68,68,.05)}
/* Final scene */
.final-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:600px}
.stat-card{background:linear-gradient(145deg,#1e293b,#162032);border:1px solid #334155;border-radius:16px;padding:24px;text-align:center}
.stat-card .num{font-size:36px;font-weight:900;font-family:'JetBrains Mono',monospace;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-card .lbl{font-size:12px;color:#64748b;font-weight:600;margin-top:4px}
/* Animated bg */
.bg-particles{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.bg-particles .p{position:absolute;border-radius:50%;background:rgba(59,130,246,.08);animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}}
/* Scene transition */
.scene-fade-enter{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
/* Part separator */
.part-separator{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:50;background:rgba(15,23,42,.95);flex-direction:column;gap:12px}
.part-separator h1{font-size:40px;font-weight:900;letter-spacing:4px}
/* Search/filter */
.search-box{display:flex;gap:8px;margin-bottom:16px}
.search-box input{flex:1;padding:10px 16px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:14px;outline:none}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.filter-chip{padding:4px 12px;border-radius:16px;font-size:11px;font-weight:600;border:1px solid #475569;background:#1e293b;color:#94a3b8;cursor:pointer;transition:all .2s}
.filter-chip.active{background:#3b82f6;border-color:#3b82f6;color:#fff}
</style>
</head>
<body>
<!-- Title Bar -->
<div class="title-bar">
  <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
  <div class="file-name">▶ IT_Talent_AI_Profile_Final_Demo_1080p.mp4</div>
  <div style="font-size:11px;color:#475569">1920×1080</div>
</div>

<!-- Player -->
<div class="player-wrap" id="player">
  <!-- Viewport -->
  <div class="viewport" id="viewport">
    <!-- Bg particles -->
    <div class="bg-particles" id="particles"></div>
    <!-- Watermark -->
    <div class="watermark">IT TALENT AI PROFILE — FINAL DEMO</div>
    <!-- Badge -->
    <div class="demo-badge">
      <div class="chip" style="background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff" id="partBadge">PART 1: ỨNG VIÊN</div>
      <div class="chip" style="background:#1e293b;color:#94a3b8;border:1px solid #334155">12/12 Chức Năng • Sprint 1-4</div>
    </div>
    <!-- Scene content -->
    <div id="sceneContent" class="scene-container"></div>
    <!-- Virtual cursor -->
    <div class="vcursor" id="vcursor" style="left:-50px;top:-50px">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 3l14 9-7 2-4 7L5 3z" fill="#fff" stroke="#000" stroke-width="1.5"/></svg>
    </div>
    <!-- Subtitle -->
    <div class="subtitle-bar"><div class="subtitle-text" id="subtitleText" style="opacity:0"></div></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn" onclick="prevScene()" title="Previous">⏮</button>
    <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()" title="Play/Pause">▶</button>
    <button class="ctrl-btn" onclick="nextScene()" title="Next">⏭</button>
    <div class="time-display"><span id="timeCur">00:00</span> / <span id="timeTotal">06:00</span></div>
    <div class="progress-wrap" id="progressWrap" onclick="seekTo(event)">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <button class="speed-btn" id="speedBtn" onclick="cycleSpeed()">1.0x</button>
    <button class="ctrl-btn" onclick="replayScene()" title="Replay Scene">🔄</button>
  </div>

  <!-- Scene Chips -->
  <div class="scene-chips" id="sceneChips"></div>
</div>

<script>
// ===== CONFIGURATION =====
const TOTAL_DURATION = 360;
const SCENE_DURATION = 30;
const SPEEDS = [0.5, 1, 1.5, 2, 3];
let speedIdx = 1;
let currentTime = 0;
let isPlaying = false;
let currentScene = -1;
let animFrame = null;
let lastTick = 0;

// ===== SCENES DATA =====
const scenes = [
  // ——— Scene 1: Intro & Login ———
  {
    id: 1, title: "Đăng nhập", start: 0, end: 30, part: 1,
    subtitles: [
      {at:2, text:"Hệ thống sử dụng <code>bcrypt.hashpw(password, bcrypt.gensalt())</code> để băm mật khẩu — không lưu plaintext, chống brute-force với salt ngẫu nhiên."},
      {at:9, text:"Sau khi xác thực, server tạo JWT token bằng thuật toán <code>HS256</code>: <code>jwt.encode({sub, user_id, email, role, exp, iat}, SECRET_KEY)</code> — token hết hạn sau 60 phút."},
      {at:17, text:"Guard middleware giải mã JWT → kiểm tra role (candidate/recruiter) → cho phép hoặc từ chối truy cập endpoint. API: <code>POST /login</code>, <code>POST /register</code>."},
      {at:24, text:"Quick Login cho phép đăng nhập nhanh với tài khoản demo. Toàn bộ 24 API endpoints được bảo vệ bởi JWT authentication layer."}
    ],
    render() {
      return `<div class="scene-container scene-fade-enter" style="flex-direction:column;gap:20px">
        <div style="text-align:center;margin-bottom:12px">
          <div style="font-size:48px;font-weight:900;background:linear-gradient(135deg,#3b82f6,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px">IT TALENT AI</div>
          <div style="font-size:14px;color:#64748b;letter-spacing:4px;font-weight:600;margin-top:4px">PROFILE MANAGEMENT SYSTEM</div>
        </div>
        <div class="login-card">
          <h2>Đăng Nhập</h2>
          <p class="subtitle">Đăng nhập vào hệ thống quản lý nhân tài IT</p>
          <div class="form-group">
            <label>📧 Email</label>
            <input class="form-input" type="email" value="candidate@demo.com" id="loginEmail"/>
          </div>
          <div class="form-group">
            <label>🔒 Mật khẩu</label>
            <input class="form-input" type="password" value="••••••••"/>
          </div>
          <button class="login-btn primary" id="loginBtn">Đăng Nhập →</button>
          <div style="text-align:center;margin:16px 0 8px;font-size:12px;color:#475569">— Quick Login —</div>
          <div class="quick-login">
            <button id="qlCandidate">👨‍💻 Ứng Viên</button>
            <button id="qlRecruiter">🏢 Nhà Tuyển Dụng</button>
          </div>
          <div style="margin-top:16px;padding:12px;border-radius:8px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);font-size:11px;color:#93c5fd;text-align:center">
            🔐 Bcrypt + JWT HS256 • Token 60min • Role-based Guard
          </div>
        </div>
      </div>`;
    }
  },
  // ——— Scene 2: 3D Profile & Career ———
  {
    id: 2, title: "Hồ sơ 3D", start: 30, end: 60, part: 1,
    subtitles: [
      {at:32, text:"Hồ sơ ứng viên hiển thị dạng 3D card với CSS <code>perspective(800px)</code> và LED conic-gradient avatar — tạo trải nghiệm trực quan, hiện đại."},
      {at:39, text:"Thuật toán xác định Level: <code>Senior</code> (years≥5 AND score≥75), <code>Middle</code> (years≥2 AND score≥55), <code>Junior</code> (years≥1 AND score≥40), <code>Intern</code> (otherwise)."},
      {at:46, text:"Hàm <code>determine_level(years, total_score)</code> áp dụng logic AND — ứng viên phải thỏa mãn CẢ HAI điều kiện kinh nghiệm VÀ điểm tổng để đạt level."},
      {at:53, text:"Career Roadmap hiển thị tiến trình từ Intern → Senior, cập nhật tự động sau mỗi lần đánh giá. Dữ liệu lưu trong bảng <code>profiles</code> (level, total_score)."}
    ],
    render() {
      return `<div class="scene-container scene-fade-enter" style="gap:40px">
        <div class="profile-3d" id="profileCard">
          <div class="avatar-led"><div class="av-inner">NV</div></div>

// ===== INIT =====
function init() {
  createParticles();
  buildSceneChips();
  loadScene(0);
}

function createParticles() {
  const c = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'p';
    const size = 4 + Math.random() * 12;
    p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;animation-duration:${8+Math.random()*12}s;animation-delay:${Math.random()*8}s`;
    c.appendChild(p);
  }
}

function buildSceneChips() {
  const c = document.getElementById('sceneChips');
  c.innerHTML = '';
  let lastPart = 0;
  scenes.forEach((s, i) => {
    if (s.part !== lastPart) {
      const lbl = document.createElement('div');
      lbl.className = 'scene-chip part-label';
      lbl.textContent = s.part === 1 ? 'PART 1' : 'PART 2';
      c.appendChild(lbl);
      lastPart = s.part;
    }
    const ch = document.createElement('div');
    ch.className = 'scene-chip' + (i === 0 ? ' active' : '');
    ch.textContent = `${s.id}. ${s.title}`;
    ch.dataset.index = i;
    ch.onclick = () => jumpToScene(i);
    c.appendChild(ch);
  });
}

function loadScene(idx) {
  if (idx < 0 || idx >= scenes.length) return;
  const prev = currentScene;
  currentScene = idx;
  const scene = scenes[idx];
  document.getElementById('sceneContent').innerHTML = scene.render();
  document.getElementById('partBadge').textContent = scene.part === 1 ? 'PART 1: ỨNG VIÊN' : 'PART 2: NHÀ TUYỂN DỤNG';
  document.getElementById('partBadge').style.background = scene.part === 1 ? 'linear-gradient(135deg,#3b82f6,#8b5cf6)' : 'linear-gradient(135deg,#ec4899,#f59e0b)';

  // Update chips
  document.querySelectorAll('.scene-chip:not(.part-label)').forEach((ch, i) => {
    ch.classList.toggle('active', i === idx);
  });
  // Scroll chip into view
  const activeChip = document.querySelector('.scene-chip.active');
  if (activeChip) activeChip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

  updateSubtitle();
}

// ===== PLAYBACK =====
function togglePlay() {
  if (isPlaying) {
    pause();
  } else {
    play();
  }
}

function play() {
  isPlaying = true;
  document.getElementById('playBtn').textContent = '⏸';
  lastTick = performance.now();
  tick();
}

function pause() {
  isPlaying = false;
  document.getElementById('playBtn').textContent = '▶';
  if (animFrame) cancelAnimationFrame(animFrame);
}

function tick() {
  if (!isPlaying) return;
  const now = performance.now();
  const dt = (now - lastTick) / 1000 * SPEEDS[speedIdx];
  lastTick = now;
  currentTime = Math.min(currentTime + dt, TOTAL_DURATION);

  updateUI();

  if (currentTime >= TOTAL_DURATION) {
    pause();
    return;
  }
  animFrame = requestAnimationFrame(tick);
}

function updateUI() {
  // Progress
  const pct = (currentTime / TOTAL_DURATION) * 100;
  document.getElementById('progressFill').style.width = pct + '%';

  // Time display
  document.getElementById('timeCur').textContent = formatTime(currentTime);

  // Scene
  const sceneIdx = Math.min(Math.floor(currentTime / SCENE_DURATION), scenes.length - 1);
  if (sceneIdx !== currentScene) {
    loadScene(sceneIdx);
  }

  updateSubtitle();
  updateCursor();
}

function updateSubtitle() {
  const scene = scenes[currentScene];
  if (!scene) return;
  const el = document.getElementById('subtitleText');
  const localTime = currentTime;
  let activeText = '';
  for (let i = scene.subtitles.length - 1; i >= 0; i--) {
    if (localTime >= scene.subtitles[i].at) {
      activeText = scene.subtitles[i].text;
      break;
    }
  }
  if (activeText) {
    el.innerHTML = activeText;
    el.style.opacity = '1';
  } else {
    el.style.opacity = '0';
  }
}

function updateCursor() {
  const vc = document.getElementById('vcursor');
  const scene = scenes[currentScene];
  if (!scene) return;
  // Simple cursor animation based on scene time
  const t = currentTime - scene.start;
  const viewport = document.getElementById('viewport');
  const vw = viewport.offsetWidth;
  const vh = viewport.offsetHeight;

  // Move cursor around important areas
  const phase = (t % 7.5) / 7.5; // cycle every 7.5s
  const cx = vw * (0.3 + 0.4 * Math.sin(phase * Math.PI * 2));
  const cy = vh * (0.3 + 0.3 * Math.cos(phase * Math.PI * 1.5));
  vc.style.left = cx + 'px';
  vc.style.top = cy + 'px';

  // Click ripple every ~5s
  if (Math.abs(t % 5 - 0.1) < 0.15) {
    createRipple(cx, cy);
  }
}

function createRipple(x, y) {
  const viewport = document.getElementById('viewport');
  const r = document.createElement('div');
  r.className = 'click-ripple';
  r.style.left = (x - 20) + 'px';
  r.style.top = (y - 20) + 'px';
  viewport.appendChild(r);
  setTimeout(() => r.remove(), 600);
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

// ===== CONTROLS =====
function seekTo(e) {
  const wrap = document.getElementById('progressWrap');
  const rect = wrap.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  currentTime = pct * TOTAL_DURATION;
  updateUI();
}

function prevScene() {
  const idx = Math.max(0, currentScene - 1);
  currentTime = scenes[idx].start;
  loadScene(idx);
  updateUI();
}

function nextScene() {
  const idx = Math.min(scenes.length - 1, currentScene + 1);
  currentTime = scenes[idx].start;
  loadScene(idx);
  updateUI();
}

function replayScene() {
  currentTime = scenes[currentScene].start;
  updateUI();
  if (!isPlaying) play();
}

function jumpToScene(idx) {
  currentTime = scenes[idx].start;
  loadScene(idx);
  updateUI();
}

function cycleSpeed() {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  document.getElementById('speedBtn').textContent = SPEEDS[speedIdx] + 'x';
}

// ===== KEYBOARD =====
document.addEventListener('keydown', e => {
  switch(e.key) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case 'ArrowRight': currentTime = Math.min(currentTime + 5, TOTAL_DURATION); updateUI(); break;
    case 'ArrowLeft': currentTime = Math.max(currentTime - 5, 0); updateUI(); break;
    case 'ArrowUp': e.preventDefault(); nextScene(); break;
    case 'ArrowDown': e.preventDefault(); prevScene(); break;
  }
});

// Start
init();
</script>
</body>
</html>
